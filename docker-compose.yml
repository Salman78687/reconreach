services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Persist the SQLite database across container restarts
      - db_data:/app/data
    environment:
      DATABASE_URL: sqlite:////app/data/osint_cold_call.db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
